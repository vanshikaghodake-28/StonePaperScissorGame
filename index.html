<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StonePaperScissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>StonePaperScissor Game</h1>
    <div class="choices">
        <div class="choice" id="stone">
            <img src="./images/stone.webp"/>
        </div>
        <div class="choice" id="paper">
            <img src = "./images/paper1.jpg"/>
        </div>
        <div class="choice" id="scissor">
            <img src="./images/Scissor.webp"/>
        </div>
    </div>
    <div class="score-board">
        <div class="score" >
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score" >
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">play your move</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
